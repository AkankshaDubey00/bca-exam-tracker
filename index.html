
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA Exam Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My BCA Study Dashboard</h1>
        <p>RMLAU | November 2026 Exams</p>
    </header>

    <main>
        <section class="stats">
            <div class="stat-card">
                <h2 id="totalUnits">20</h2>
                <p>Total Units</p>
            </div>

            <div class="stat-card">
                <h2 id="completedUnits">0</h2>
                <p>Completed</p>
            </div>

            <div class="stat-card">
                <h2 id="percentage">0%</h2>
                <p>Overall Progress</p>
            </div>
        </section>

        <h2 class="section-title">My Subjects</h2>

        <section id="subjects" class="subjects">
            <!-- JavaScript will add subjects here -->
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
